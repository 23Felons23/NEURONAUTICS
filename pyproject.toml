[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronautics"
version = "0.1.0"
description = "Multimodal brain data navigator"
requires-python = ">=3.10"
dependencies = [
    "nibabel>=5.0",
    "numpy>=1.26",
    "vtk>=9.3",
    "PySide6>=6.6",
    "dipy>=1.0",
    "pyvista>=0.40",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
tracking = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]

[project.scripts]
neuronautics = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
